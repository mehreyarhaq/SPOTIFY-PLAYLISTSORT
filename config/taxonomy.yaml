# Families group genres for broad-tag voting. A broad tag ("house" from Discogs, "electronic"
# from Spotify) can only ever vote for a family, never for a specific genre.
families:
  house:      "House family"
  techno:     "Techno family"
  electronic: "Electronic (unspecific)"
  bass:       "Bass / breaks / garage family"
  trance:     "Trance family"
  commercial: "Commercial dance / mainstage"
  hard:       "Hard dance"
  other:      "Non-music / tools"

# Aliases: raw tag (matched case- and punctuation-insensitively) -> one or more canonical targets.
# `sources` restricts the rule to those sources; omit for all sources. Multiple targets split the
# vote equally unless `weights` is given. `family:` targets are broad (parent-only).
# Target syntax: "genre_key" | "genre_key.subgenre_key" | "family:<family_key>".
aliases:
  # --- broad tags: family-level only -------------------------------------------------------
  - { raw: "electronic",  target: "family:electronic" }
  - { raw: "electronica", target: "family:electronic", sources: [spotify, deezer, itunes, apple, lastfm, musicbrainz, audio_discogs400] }
  - { raw: "dance",       target: "family:electronic" }
  - { raw: "edm",         target: "family:electronic" }
  - { raw: "club",        target: "family:electronic" }
  - { raw: "electro",     target: "family:electronic", sources: [deezer, itunes, apple, spotify] }
  - { raw: "electro",     target: "electro", sources: [audio_discogs400, discogs, musicbrainz] }
  - { raw: "house",       target: "family:house", sources: [discogs, musicbrainz, lastfm, spotify, deezer, itunes, apple, sonovault, audio_discogs400] }
  - { raw: "techno",      target: "family:techno" }
  - { raw: "detroit techno", target: "family:techno" }
  - { raw: "trance",      target: "family:trance", sources: [discogs, musicbrainz, lastfm, spotify, deezer, itunes, apple, audio_discogs400] }
  # --- afro ---------------------------------------------------------------------------------
  - { raw: "afro-house",  target: "afro_house" }
  - { raw: "afrohouse",   target: "afro_house" }
  - { raw: "afro deep",   target: "afro_house" }
  - { raw: "afro / latin / brazilian", target: "afro_house.afro_latin" }
  - { raw: "afro tech",   targets: ["afro_house.afro_melodic", "tech_house.latin_tech"], note: "no Beatport equivalent; BPM/feel decides" }
  - { raw: "afrotech",    targets: ["afro_house.afro_melodic", "tech_house.latin_tech"] }
  - { raw: "tribal house", targets: ["afro_house.afro_latin", "tech_house.latin_tech"] }
  - { raw: "tribal",      targets: ["afro_house.afro_latin", "tech_house.latin_tech"] }
  - { raw: "latin house", targets: ["afro_house.afro_latin", "tech_house.latin_tech"] }
  - { raw: "3-step",      target: "afro_house.three_step" }
  - { raw: "3 step",      target: "afro_house.three_step" }
  - { raw: "afro melodic house", target: "afro_house.afro_melodic" }
  # --- tech house / minimal -----------------------------------------------------------------
  - { raw: "tech-house",  target: "tech_house" }
  - { raw: "techhouse",   target: "tech_house" }
  - { raw: "deep tech",   target: "minimal_deep_tech.deep_tech" }
  - { raw: "deep-tech",   target: "minimal_deep_tech.deep_tech" }
  - { raw: "minimal",     target: "minimal_deep_tech" }
  - { raw: "minimal house", target: "minimal_deep_tech.minimal_house" }
  - { raw: "minimal deep tech", target: "minimal_deep_tech" }
  - { raw: "microhouse",  target: "minimal_deep_tech" }
  - { raw: "micro house", target: "minimal_deep_tech" }
  - { raw: "rominimal",   target: "minimal_deep_tech" }
  - { raw: "minimal techno", targets: ["techno_raw.deep_hypnotic", "minimal_deep_tech"], note: "ambiguous; BPM decides (<128 leans minimal/deep tech)" }
  # --- melodic / progressive / organic ------------------------------------------------------
  - { raw: "melodic techno", target: "melodic_house_techno.melodic_techno" }
  - { raw: "melodic house", target: "melodic_house_techno.melodic_house" }
  - { raw: "melodic house and techno", target: "melodic_house_techno" }
  - { raw: "melodic / progressive house", targets: ["melodic_house_techno", "progressive_house"] }
  - { raw: "progressive",  target: "progressive_house", sources: [discogs, musicbrainz, lastfm, sonovault] }
  - { raw: "progressive techno", targets: ["melodic_house_techno.melodic_techno", "progressive_house"] }
  - { raw: "prog house",   target: "progressive_house" }
  - { raw: "organic house / downtempo", target: "organic_house", note: "old Beatport name (pre Apr 2025)" }
  - { raw: "ethnic house", target: "organic_house" }
  - { raw: "ethno house",  target: "organic_house" }
  - { raw: "slow house",   target: "organic_house" }
  # --- deep / house / jackin / funky / disco ------------------------------------------------
  - { raw: "deep-house",   target: "deep_house" }
  - { raw: "deephouse",    target: "deep_house" }
  - { raw: "acid house",   target: "house.acid" }
