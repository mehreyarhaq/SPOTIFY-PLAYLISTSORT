# Canonical genre taxonomy = Beatport's genre / sub-genre tree (names as on beatport.com, Oct 2026).
# Every other source is mapped into this tree through `aliases`. Keys are stable identifiers used in
# the database; display names may change when Beatport renames things.
#
# Tag identity: "<genre_key>" or "<genre_key>.<subgenre_key>".
# Specificity: subgenre > genre > family. Only `family` tags are "broad" and vote parent-only.
version: "2026-10-15"
sources:
  beatport_live_nav: "2026-10-14 (genre ids from beatport.com navigation)"
  beatport_delivery_dictionary: "2025-05 (sub-genre names; see docs/research/reference)"
  beatport_v4_old_dump: "sub-genre ids where known (may be stale)"

